name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout LGHS Imager
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        shell: powershell
        run: |
          choco install -y cmake ninja innosetup

      - name: Install Qt 6.11.1 MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          cache: true

      - name: Locate Qt and MinGW
        id: qt
        shell: powershell
        run: |
          $qt = $env:QT_ROOT_DIR
          if (-not $qt) { $qt = $env:Qt6_DIR | Split-Path -Parent | Split-Path -Parent }
          $gcc = (Get-Command gcc.exe -ErrorAction SilentlyContinue).Source
          if (-not $gcc) { throw 'MinGW gcc.exe was not found after Qt setup.' }
          $mingw = Split-Path -Parent (Split-Path -Parent $gcc)
          "qt=$qt" >> $env:GITHUB_OUTPUT
          "mingw=$mingw" >> $env:GITHUB_OUTPUT
          Write-Host "Qt: $qt"
          Write-Host "MinGW: $mingw"

      - name: Bootstrap Raspberry Pi Imager upstream
        shell: powershell
        run: .\scripts\bootstrap-upstream.ps1

      - name: Build LGHS Imager installer
        shell: powershell
        run: |
          .\scripts\build-windows.ps1 -QtRoot '${{ steps.qt.outputs.qt }}' -MingwRoot '${{ steps.qt.outputs.mingw }}'

      - name: Create SHA256 release asset
        shell: powershell
        run: .\scripts\make-release-assets.ps1

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LGHS-Imager-Windows-x64
          path: |
            dist/LGHS-Imager-Setup-x64.exe
            dist/LGHS-Imager-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "LGHS Imager $tag" --generate-notes
          }
          gh release upload $tag `
            dist/LGHS-Imager-Setup-x64.exe `
            dist/LGHS-Imager-Setup-x64.exe.sha256 `
            --clobber
