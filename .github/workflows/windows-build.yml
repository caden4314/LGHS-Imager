name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout LGHS Imager
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set automatic build version
        id: version
        shell: powershell
        run: |
          $version = "0.1.${{ github.run_number }}"
          Set-Content -Path VERSION -Value $version -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "LGHS Imager build version: $version"

      - name: Install build tools
        shell: powershell
        run: |
          choco install -y cmake ninja innosetup
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
            throw "Chocolatey returned exit code $LASTEXITCODE"
          }

          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'cmake --version failed' }

          ninja --version
          if ($LASTEXITCODE -ne 0) { throw 'ninja --version failed' }

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $isccInfo = (Get-Item $iscc).VersionInfo
          Write-Host "Inno Setup compiler: $iscc"
          Write-Host "Inno Setup version: $($isccInfo.FileVersion)"

      - name: Install Qt 6.9.3 and MinGW 13.1
        uses: jurplel/install-qt-action@v4.2.0
        with:
          version: '6.9.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          add-tools-to-path: true
          set-env: true
          cache: true
          aqtversion: '==3.3.*'

      - name: Locate and verify Qt toolchain
        id: qt
        shell: powershell
        run: |
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Write-Host "Qt6_DIR=$env:Qt6_DIR"
          Write-Host "IQTA_TOOLS=$env:IQTA_TOOLS"

          $qt = $env:QT_ROOT_DIR
          if (-not $qt -and $env:Qt6_DIR) {
            $qt = Split-Path -Parent (Split-Path -Parent $env:Qt6_DIR)
          }
          if (-not $qt -or -not (Test-Path $qt)) {
            throw "Qt root could not be located. QT_ROOT_DIR='$env:QT_ROOT_DIR' Qt6_DIR='$env:Qt6_DIR'"
          }

          $gccCmd = Get-Command gcc.exe -ErrorAction SilentlyContinue
          if (-not $gccCmd) {
            Write-Host 'PATH entries containing mingw:'
            ($env:PATH -split ';' | Where-Object { $_ -match 'mingw' }) | ForEach-Object { Write-Host "  $_" }
            if ($env:IQTA_TOOLS) {
              Get-ChildItem $env:IQTA_TOOLS -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
            }
            throw 'MinGW gcc.exe was not found after Qt setup.'
          }

          $gcc = $gccCmd.Source
          $mingwBin = Split-Path -Parent $gcc
          $mingw = Split-Path -Parent $mingwBin

          $qmake = Join-Path $qt 'bin\qmake.exe'
          $windeployqt = Join-Path $qt 'bin\windeployqt.exe'
          if (-not (Test-Path $qmake)) { throw "qmake.exe not found at $qmake" }
          if (-not (Test-Path $windeployqt)) { throw "windeployqt.exe not found at $windeployqt" }

          & $gcc --version
          if ($LASTEXITCODE -ne 0) { throw 'gcc --version failed' }
          & $qmake -v
          if ($LASTEXITCODE -ne 0) { throw 'qmake -v failed' }

          "qt=$qt" >> $env:GITHUB_OUTPUT
          "mingw=$mingw" >> $env:GITHUB_OUTPUT
          Write-Host "Qt root:    $qt"
          Write-Host "MinGW root: $mingw"

      - name: Bootstrap Raspberry Pi Imager upstream
        shell: powershell
        run: .\scripts\bootstrap-upstream.ps1

      - name: Build LGHS Imager installer
        shell: powershell
        run: |
          .\scripts\build-windows.ps1 -QtRoot '${{ steps.qt.outputs.qt }}' -MingwRoot '${{ steps.qt.outputs.mingw }}'

      - name: Create SHA256 release asset
        shell: powershell
        run: .\scripts\make-release-assets.ps1

      - name: Verify release files
        shell: powershell
        run: |
          $exe = 'dist\LGHS-Imager-Setup-x64.exe'
          $sha = 'dist\LGHS-Imager-Setup-x64.exe.sha256'
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          if (-not (Test-Path $sha)) { throw "$sha was not produced" }
          Get-Item $exe, $sha | Format-Table Name, Length, LastWriteTime
          Get-FileHash -Algorithm SHA256 $exe

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LGHS-Imager-Windows-x64-${{ steps.version.outputs.version }}
          path: |
            dist/LGHS-Imager-Setup-x64.exe
            dist/LGHS-Imager-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish automatic GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release create $tag `
            dist/LGHS-Imager-Setup-x64.exe `
            dist/LGHS-Imager-Setup-x64.exe.sha256 `
            --target '${{ github.sha }}' `
            --title "LGHS Imager $tag" `
            --generate-notes
