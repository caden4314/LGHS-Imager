name: PowerShell Validate

on:
  push:
    branches: [ main, release-0.6.0-zero-touch ]
  pull_request:
  workflow_dispatch:

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse active PowerShell entrypoints
        shell: powershell
        run: |
          $files = @(
            'scripts\launch.ps1',
            'scripts\launch-local-student.ps1',
            'scripts\build-windows.ps1',
            'scripts\bootstrap-upstream.ps1',
            'scripts\setup-windows.ps1',
            'scripts\make-release-assets.ps1',
            'updater\LGHS-Imager-Updater.ps1',
            'app\LGHS-Imager-v4.ps1',
            'app\LGHS-StockBootstrap-v2.ps1',
            'app\LGHS-StockBootstrap-v3.ps1',
            'app\LGHS-StockBootstrap-v4.ps1',
            'app\LGHS-StockBootstrap-v5.ps1',
            'app\LGHS-StockBootstrap-v6.ps1',
            'app\LGHS-StockBootstrap-v7.ps1',
            'app\LGHS-StockBootstrap-v8.ps1',
            'app\LGHS-StockBootstrap-v9.ps1',
            'app\LGHS-StockBootstrap-v10.ps1',
            'app\LGHS-StockBootstrap-v11.ps1'
          )
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              Write-Host "Syntax errors in $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host ("line {0}: {1}" -f $_.Extent.StartLineNumber,$_.Message) -ForegroundColor Red }
            } else {
              Write-Host "PASS $file" -ForegroundColor Green
            }
          }
          if ($failed) { throw 'LGHS Imager PowerShell syntax validation failed.' }

      - name: Validate JSON and active flash invariants
        shell: powershell
        run: |
          $config = Get-Content 'config\lghs-imager.json' -Raw | ConvertFrom-Json
          $osList = Get-Content 'os-list\lghs-os-list.json' -Raw | ConvertFrom-Json
          if ($config.target.requiredMemoryGb -ne 4) { throw 'Pi 5 minimum RAM profile must be 4 GB.' }
          $supported = @($config.target.supportedMemoryGb | ForEach-Object { [int]$_ } | Sort-Object)
          if (($supported -join ',') -ne '4,8') { throw 'Supported Pi 5 RAM profiles must be exactly 4 and 8 GB.' }
          if ([string]$config.repository.stockBaseImage -notmatch '^https://') { throw 'Stock image source must use HTTPS.' }
          if ([string]$config.repository.bootstrapGitRepository -notmatch '^https://') { throw 'LGHS bootstrap repository must use HTTPS.' }
          if ([string]$config.repository.bootstrapGitBranch -ne 'main') { throw 'Zero-touch Imager must follow the merged LGHS-System main branch.' }
          if ([string]$config.repository.manifest -notmatch '/main/os-list/lghs-os-list\.json$') { throw 'OS manifest must follow LGHS-Imager main.' }
          if ([bool]$config.features.stockImageBootstrapFallback) { throw 'Zero-touch Student imaging must not silently fall back to stock Raspberry Pi OS.' }
          if ([string]$config.fleet.controllerHost -ne 'LGCSCONT-CF') { throw 'Controller enrollment must use the configured Cloudflare SSH alias.' }
          if ([string]$config.fleet.controllerHost -match '^192\.168\.50\.') { throw 'Zero-touch enrollment must not depend on the retired direct Ethernet management network.' }
          if ([string]$config.fleet.fleetApiUrl -notmatch '^https://') { throw 'Fleet API URL must use HTTPS.' }
          $launch = Get-Content 'scripts\launch.ps1' -Raw
          if ($launch -notmatch 'LGHS-StockBootstrap-v11\.ps1') { throw 'Launcher is not using bootstrap v11.' }
          if ($launch -notmatch '--cloudinit-userdata') { throw 'Cloud-init replacement is missing.' }
          if ($launch -notmatch 'Safety check failed: legacy first-run injection remains') { throw 'Post-patch legacy bootstrap safety check is missing.' }
          if ($launch -notmatch 'LghsHardwareRamGb') { throw '4/8 GB pre-flash selector is missing.' }
          $managed = Get-Content 'scripts\launch-local-student.ps1' -Raw
          foreach ($needle in @('ImagePath','Sha256','LGCSCONT-CF','Use STUDENT mode')) {
            if ($managed -notmatch [regex]::Escape($needle)) { throw "Managed local Student image flow missing: $needle" }
          }
          $v11 = Get-Content 'app\LGHS-StockBootstrap-v11.ps1' -Raw
          foreach ($needle in @('lghs-stage2.sh','lghs-provision.conf','lghs-provision-secrets.conf','lghs-controller-key.pub','lghs-controller-key')) {
            if ($v11 -notmatch [regex]::Escape($needle)) { throw "LF safety coverage missing: $needle" }
          }
          foreach ($needle in @('New-LghsFleetApiToken','FLEET_API_TOKEN_B64','FLEET_API_URL','lghs-imager-enroll','Register-LghsFleetApiToken')) {
            if ($v11 -notmatch [regex]::Escape($needle)) { throw "Zero-touch Fleet enrollment coverage missing: $needle" }
          }
          if ($v11 -notmatch '\$env:ProgramData') { throw 'Fleet SSH known-hosts storage must use ProgramData for Windows paths with spaces.' }
          if ($v11 -match '192\.168\.50\.2') { throw 'Active Fleet enrollment helper must not retain the retired direct Ethernet fallback.' }
          if ($v11 -notmatch 'LGCSCONT-CF') { throw 'Active Fleet enrollment helper must default to the Cloudflare SSH alias.' }
          if ($v11 -match '(?im)^\s*\$host\s*=') { throw 'Fleet enrollment helper must not assign the reserved PowerShell $Host automatic variable.' }
          if ($v11 -notmatch '\$controllerHost') { throw 'Fleet enrollment helper must use the safe controllerHost variable.' }
          . .\app\LGHS-StockBootstrap-v11.ps1
          $token = New-LghsFleetApiToken
          if ($token.Length -lt 32 -or $token -match '\s') { throw 'Generated Fleet API token is invalid.' }
          $cloud = New-LghsCloudInitUserData 'controller'
          foreach ($needle in @('lghs-firstboot-progress-ui','lghs-firstboot-progress-launch','lghs-firstboot-progress.desktop','LGHS SETUP PROGRESS','ALL GOOD')) {
            if ($cloud -notmatch [regex]::Escape($needle)) { throw "First-boot progress UI missing from active cloud-init: $needle" }
          }
          if (-not $osList.os_list) { throw 'OS list contains no entries.' }
